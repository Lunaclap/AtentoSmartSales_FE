<!-- Cabecera de la vista -->
<div class="d-flex justify-content-between align-items-center mb-4">
  <div>
    <h2 class="fw-bold mb-1">Clientes</h2>
    <p class="text-muted small mb-0">Cartera completa del área · 96 clientes</p>
  </div>
  <button class="btn btn-sm btn-primary fw-semibold px-3" (click)="toggleFormulario()">
    {{ mostrarFormulario ? 'Ver cartera' : 'Nuevo cliente' }}
  </button>
</div>

<!-- Si se hace clic en 'Nuevo cliente', se muestra el componente compartido ClientForm -->
<div *ngIf="mostrarFormulario" class="mb-4">
  <app-client-form></app-client-form>
</div>

<!-- Vista normal de cartera utilizando el componente compartido DataTable -->
<div *ngIf="!mostrarFormulario">
  <!-- Barra de búsqueda y filtro por estado -->
  <div class="d-flex flex-wrap gap-3 align-items-center mb-4">
    <input 
      type="text" 
      class="form-control form-control-sm bg-black text-light border-secondary w-auto" 
      style="min-width: 280px;" 
      placeholder="Buscar por nombre o documento" />
    
    <select class="form-select form-select-sm bg-black text-light border-secondary w-auto">
      <option value="todos">Todos los estados</option>
      <option value="contactado">Contactado</option>
      <option value="cerrado">Cerrado</option>
    </select>
  </div>

  <!-- Componente compartido: DataTable -->
  <app-data-table [columnas]="columnasClientes">
    <tr *ngFor="let c of clientesCartera">
      <td>
        <div class="fw-bold">{{ c.nombre }}</div>
        <small class="text-muted">{{ c.tipo }} · {{ c.doc }}</small>
      </td>
      <td>{{ c.asesor }}</td>
      <td><span class="text-muted small">● {{ c.campana }}</span></td>
      <td><span [ngClass]="c.claseEstado">● {{ c.estado }}</span></td>
      <td class="text-muted">{{ c.ultimoContacto }}</td>
      <td>{{ c.proximoSeguimiento }}</td>
      <td>
        <button class="btn btn-sm btn-outline-secondary text-light py-1 px-2" style="font-size: 0.8rem;">Ver ficha</button>
      </td>
    </tr>
  </app-data-table>
</div>
