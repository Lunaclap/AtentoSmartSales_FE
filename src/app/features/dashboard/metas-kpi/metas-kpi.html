<app-page-head titulo="Metas y configuración de KPI" sub="Define la meta mensual de ventas de cada asesor" />

<div class="g2">
  <!-- Meta mensual por asesor -->
  <section class="card">
    <div class="card-h">
      <div>
        <h2>Meta mensual por asesor</h2>
        <p class="sub">Ventas cerradas por mes. Los indicadores se recalculan al guardar.</p>
      </div>
    </div>
    <form novalidate (ngSubmit)="guardar()">
      <app-data-table [columnas]="columnasMetas" [derecha]="['Meta mensual']">
        @for (a of asesoresMetas; track a.id) {
          <tr>
            <td class="nm"><b>{{ a.n }}</b></td>
            <td>{{ a.eq }}</td>
            <td><app-camp-chip [id]="a.camp" /></td>
            <td class="r">
              <label class="sr" [for]="'m' + a.id">Meta de {{ a.n }}</label>
              <input [id]="'m' + a.id" class="inp" type="number" min="1" max="200" step="1" style="width:90px;text-align:right"
                     [(ngModel)]="a.metaMensual" [name]="'m' + a.id" />
            </td>
          </tr>
        }
      </app-data-table>
      <p class="err" aria-live="polite">{{ error() }}</p>
      <div class="row-actions"><button type="submit" class="btn pri">Guardar metas</button></div>
    </form>
  </section>

  <!-- Definición de KPI -->
  <section class="card">
    <div class="card-h"><div><h2>Definición de KPI</h2><p class="sub">Así se calcula cada indicador</p></div></div>
    <dl class="dl" style="grid-template-columns:1fr">
      @for (k of definiciones; track k.t) {
        <div>
          <dt style="font-weight:600;color:var(--ink)">{{ k.t }}</dt>
          <dd style="color:var(--ink-2)">{{ k.d }}</dd>
        </div>
      }
    </dl>
  </section>
</div>
