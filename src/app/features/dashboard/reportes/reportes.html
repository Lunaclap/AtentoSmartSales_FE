<app-page-head titulo="Reportes" sub="Arma el informe que necesitas para tu reunión de seguimiento" [fecha]="false">
  <button type="button" class="btn pri" (click)="copiarCsv()">Copiar como CSV</button>
</app-page-head>

<!-- Parámetros del reporte -->
<section class="card">
  <div class="card-h"><div><h2>Parámetros del reporte</h2></div></div>
  <app-filter-bar (filterChange)="onFiltroCambio($event)"></app-filter-bar>
  <div class="filters" style="margin-top:12px">
    <label for="rep-g" style="font-weight:600;font-size:13px">Agrupar por</label>
    <select id="rep-g" class="sel" [ngModel]="grupo()" (ngModelChange)="grupo.set($event)">
      @for (g of grupos; track g.v) { <option [value]="g.v">{{ g.t }}</option> }
    </select>
  </div>
</section>

<!-- Resultados -->
<app-chart-panel [titulo]="'Resultados por ' + etiqueta().toLowerCase()" [subtitulo]="'Últimos ' + filtro().dias + ' días · ingreso estimado en soles'">
  <app-data-table [columnas]="columnasReporte()" [derecha]="derecha">
    @for (x of filas(); track x.k) {
      <tr>
        <td>{{ x.k }}</td>
        <ng-container *ngTemplateOutlet="cifras; context: { $implicit: x }" />
      </tr>
    }
    <tfoot>
      <tr>
        <td>Total</td>
        <ng-container *ngTemplateOutlet="cifras; context: { $implicit: total() }" />
      </tr>
    </tfoot>
  </app-data-table>
</app-chart-panel>

<ng-template #cifras let-x>
  <td class="r">{{ num(x.g) }}</td>
  <td class="r">{{ num(x.v) }}</td>
  <td class="r">{{ pc(x.g ? x.v / x.g : 0) }}</td>
  <td class="r">{{ money(x.mon) }}</td>
  <td class="r">{{ money(x.v ? x.mon / x.v : 0) }}</td>
  <td class="r">{{ pc(x.meta ? x.v / x.meta : 0, 0) }}</td>
</ng-template>
