<!-- Cabecera de la vista -->
<div class="d-flex justify-content-between align-items-center mb-4">
  <div>
    <h2 class="fw-bold mb-1">Reportes</h2>
    <p class="text-muted small mb-0">Arma el informe que necesitas para tu reunión de seguimiento</p>
  </div>
  <button class="btn btn-sm btn-primary fw-semibold px-3">Copiar como CSV</button>
</div>

<!-- Tarjeta de Parámetros del reporte con el componente FilterBar -->
<div class="card bg-black border-secondary text-light p-4 mb-4">
  <h5 class="fw-bold mb-3 small text-muted text-uppercase">Parámetros del reporte</h5>
  
  <!-- Uso de la barra de filtros compartida -->
  <app-filter-bar></app-filter-bar>

  <!-- Selector extra de agrupación visto en el diseño original -->
  <div class="d-flex align-items-center gap-2 mt-2">
    <span class="small text-muted" style="width: 80px;">Agrupar por</span>
    <select class="form-select form-select-sm bg-black text-light border-secondary w-auto">
      <option value="asesor">Asesor</option>
      <option value="equipo">Equipo</option>
      <option value="campana">Campaña</option>
    </select>
  </div>
</div>

<!-- Sección de Resultados por asesor con el componente DataTable -->
<div class="card bg-black border-secondary text-light p-4 mb-4">
  <h5 class="fw-bold mb-1">Resultados por asesor</h5>
  <small class="text-muted mb-4 d-block">Últimos 30 días · ingreso estimado en soles</small>

  <app-data-table [columnas]="columnasReporte">
    <tr *ngFor="let r of reportesAsesores">
      <td class="fw-bold">{{ r.nombre }}</td>
      <td>{{ r.gestiones }}</td>
      <td>{{ r.ventas }}</td>
      <td>{{ r.conversion }}</td>
      <td class="fw-semibold">{{ r.ingreso }}</td>
      <td>{{ r.promedio }}</td>
      <td class="text-success fw-semibold">{{ r.meta }}</td>
    </tr>
  </app-data-table>
</div>
