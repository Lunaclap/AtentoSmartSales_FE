<aside class="side">
  <div class="brand">
    <span class="brand-mark"><app-icon name="brand" /></span>
    Panel Comercial
  </div>

  <nav class="nav" aria-label="Principal">
    @for (item of menu; track item.ruta) {
      <a [routerLink]="item.ruta" routerLinkActive="active" ariaCurrentWhenActive="page">
        <app-icon [name]="item.icono" />{{ item.texto }}
      </a>
    }
  </nav>

  <div class="side-foot">
    <div class="who">
      <span class="av">{{ iniciales }}</span>
      <span><b>{{ usuario }}</b>{{ rolTexto }}</span>
    </div>
    <button type="button" class="btn sm side-out" (click)="onLogout()">
      <app-icon name="out" />Salir
    </button>
  </div>
</aside>
